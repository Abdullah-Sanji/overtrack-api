# Production API stack: Postgres + API. Creates the shared `overtrack` network that the web stack
# (over-track-web/docker-compose.prod.yml) joins as external, so bring this stack up first.
# Postgres stays on this project's private network only; the API is on both.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: overtrack, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}", POSTGRES_DB: overtrack }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U overtrack"], interval: 5s, retries: 10 }
  api:
    build: .
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://overtrack:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/overtrack
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      WEB_URL: ${WEB_URL:?set WEB_URL}
      CORS_ORIGIN: ${WEB_URL}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL}
      MAIL_FROM: ${MAIL_FROM:-OverTrack <no-reply@overtrack.local>}
      STORAGE_PATH: /data/storage
      TRUST_PROXY: 1
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes: ["storage:/data/storage"]
    networks: [default, overtrack]
networks:
  overtrack:
    name: overtrack
volumes:
  pgdata:
  storage:
